apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeecho
  labels:
    app.kubernetes.io/name: nodeecho
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeecho
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodeecho
    spec:
      serviceAccountName: nodeecho
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: nodeecho:latest
          args: [--leader-elect]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            # Keep below limits.memory, so that the garbage collector works
            # harder before the container is killed.
            - name: GOMEMLIMIT
              value: 450MiB
          ports:
            - {name: https-metrics, containerPort: 8443}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          # Measured with hack/scale.sh: about 120 MiB at 20000 pods, 160 MiB
          # while a rule change resyncs them all. Memory grows with every pod
          # of the cluster, selected or not.
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
