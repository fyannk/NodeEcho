apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeecho
  labels:
    app.kubernetes.io/name: nodeecho
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeecho
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodeecho
    spec:
      serviceAccountName: nodeecho
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: nodeecho:latest
          args: [--leader-elect]
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
