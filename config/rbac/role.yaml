# Rights in NodeEcho's own namespace: its rules ConfigMap and the leader
# election Lease.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodeecho
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodeecho
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nodeecho
subjects:
  - kind: ServiceAccount
    name: nodeecho
