name: Release

on:
  push:
    tags: ["v*"]

# Restrictive at the top; the one job that publishes asks for the scope.
permissions:
  contents: read

jobs:
  release:
    name: Package, push and sign the Helm chart, create the release
    permissions:
      contents: write # create the release
      packages: write # push the chart to ghcr
      id-token: write # OIDC identity for the keyless cosign signature and the attestations
      attestations: write # store the build provenance on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: The tag is the packaged version
        run: |
          version=$(sed -n 's/^version: //p' deploy/helm/nodeecho/Chart.yaml)
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || {
            echo "::error::tag ${GITHUB_REF_NAME} but the chart is ${version}"; exit 1; }
          ./hack/validate-packaging.sh

      - run: helm package deploy/helm/nodeecho -d dist

      # An OCI artifact next to the images: no repository index to host,
      # and Argo and Flux both read it. Signed keyless by digest, like the
      # images; the release carries the same archive as a file.
      - name: Push and sign the chart
        id: chart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "$GHCR_USER" --password-stdin
          out=$(helm push dist/nodeecho-*.tgz "oci://ghcr.io/${OWNER}/charts" 2>&1)
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<<"$out")
          [ -n "$digest" ] || { echo "::error::helm push printed no digest"; exit 1; }
          cosign sign --yes "ghcr.io/${OWNER}/charts/nodeecho@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # GitHub's own provenance for the chart, as an OCI artifact and as the
      # archive attached to the release.
      - name: Attest the chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/nodeecho
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - name: Attest the chart archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*.tgz
          generate_release_notes: true
