name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily on main: updates merge on checks that ran against an older main,
  # and a new vulnerability shows up without waiting for the next change.
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, test (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Before and after Kubernetes copies zone and region onto pods.
        kubernetes: ["1.34.1", "1.36.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...
      # The controller tests run against a real API server (envtest).
      - name: Install envtest binaries
        run: echo "KUBEBUILDER_ASSETS=$(make -s envtest-assets ENVTEST_K8S_VERSION=${{ matrix.kubernetes }})" >> "$GITHUB_ENV"
      - run: go test ./... -race -count=1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # `go run` builds the pinned linter with the go.mod toolchain; a
      # prebuilt binary from an older Go refuses the config.
      - run: make lint

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make vuln

  manifests:
    name: Manifests render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: kubectl kustomize config/default > /dev/null
      - run: kubectl kustomize config/rules > /dev/null
      - run: kubectl kustomize config/policy > /dev/null
      - run: kubectl kustomize config/prometheus > /dev/null
      - run: kubectl kustomize config/grafana > /dev/null
      - name: Components render
        run: |
          for c in metrics-http eviction-webhook; do
            dir=$(mktemp -d)
            printf 'resources: [%s/config/default]\ncomponents: [%s/config/components/%s]\n' \
              "$(realpath --relative-to="$dir" .)" "$(realpath --relative-to="$dir" .)" "$c" > "$dir/kustomization.yaml"
            kubectl kustomize "$dir" > /dev/null
          done
      - name: Dashboard is valid JSON
        run: jq -e '.panels | length > 0' config/grafana/nodeecho.json > /dev/null

  packaging:
    name: Helm chart, OLM bundle and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - run: ./hack/validate-packaging.sh

  alerts:
    name: Alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # promtool check and unit tests, in pinned containers.
      - run: make test-alerts

  # What images.yml and release.yml do on main and on a tag, without
  # publishing: an update of the actions or the Dockerfile that breaks them
  # fails here, before the merge, not at the release.
  release-dry-run:
    name: Images and chart build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - run: cosign version
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: NodeEcho
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: mode=max
          sbom: true
          build-args: VERSION=dry-run
      - name: OLM bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/olm/bundle
          file: deploy/olm/bundle.Dockerfile
          push: false
      - name: OLM catalog
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/olm/catalog
          file: deploy/olm/catalog.Dockerfile
          push: false

      - run: helm package deploy/helm/nodeecho -d dist
