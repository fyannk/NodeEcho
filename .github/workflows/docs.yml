name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths: [web/**, .github/workflows/docs.yml]

# Restrictive at the top; only deploy publishes, and only it is granted
# the tokens to do so. build just produces an artifact.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name == 'push'
        with:
          path: web/build

  deploy:
    name: Deploy to GitHub Pages
    # A GitHub Pages site is public even for a private repository, so the
    # site is published only while the repository itself is public.
    if: github.event_name == 'push' && github.event.repository.visibility == 'public'
    needs: build
    permissions:
      pages: write # publish the built site
      id-token: write # OIDC, which is how deploy-pages authenticates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement turns Pages on when it is not configured yet, which is
      # every fresh clone. Without it the action fails with "Get Pages site
      # failed" and the site never ships.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
