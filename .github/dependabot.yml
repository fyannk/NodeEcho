version: 2

# The Go module, the actions and the image bases. The documentation site
# (web/) is left out on purpose: its build tooling is most of the noise and
# none of it ships with NodeEcho. Its few browser-side libraries are its
# `dependencies`; the rest are `devDependencies`, which GitHub's default
# auto-triage dismisses as development-scoped when alerts are on.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      go-routine-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-routine-updates:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
