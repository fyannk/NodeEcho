version: 2

# The Go module, the actions and the image bases. The documentation site
# (web/) is left out on purpose: its build tooling is most of the noise and
# none of it ships with NodeEcho. Its few browser-side libraries are its
# `dependencies`; the rest are `devDependencies`, which GitHub's default
# auto-triage dismisses as development-scoped when alerts are on.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # The Go toolchain lives in go.mod too; the Go toolchain workflow
    # (hack/bump-go-toolchain.sh) moves both, Dependabot would move one.
    ignore:
      - dependency-name: golang
    groups:
      go-routine-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # The catalog's tools (deploy/olm/catalog/opm): only opm and
  # grpc-health-probe themselves; the rest follows what they release with.
  - package-ecosystem: gomod
    directory: /deploy/olm/catalog/opm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: golang
    groups:
      opm-tools:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-routine-updates:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/deploy/olm"]
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # The Go toolchain lives in go.mod too; the Go toolchain workflow
    # (hack/bump-go-toolchain.sh) moves both, Dependabot would move one.
    ignore:
      - dependency-name: golang
