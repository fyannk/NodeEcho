{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nodeecho.fullname" . }}-dashboard
  namespace: {{ .Values.dashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "nodeecho.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  nodeecho.json: |
    {{- .Files.Get "files/dashboard.json" | replace "job=\\\"nodeecho-metrics\\\"" (printf "job=\\\"%s-metrics\\\"" (include "nodeecho.fullname" .)) | nindent 4 }}
{{- end }}
