apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nodeecho.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodeecho.labels" . | nindent 4 }}
data:
  rules.yaml: |
    version: 1
    rules: {{- if .Values.rules }}
      {{- toYaml .Values.rules | nindent 4 }}
    {{- else }} []
    {{- end }}
